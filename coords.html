  function ensureApp(){ try{ if(window.firebase && !firebase.apps.length){ firebase.initializeApp({

  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
}); } }catch(e){} }
  function db(){ return firebase.firestore(); }
  function pureText(el){ for(var i = 0; i < el.childNodes.length; i++){ if(el.childNodes[i].nodeType === 1) return false; } return (el.textContent || '').trim().length > 0; }
  function excluded(el){ try{ return !!el.closest(EXCLUDED); }catch(e){ return false; } }
  function targets(){
    var out = [];
    document.querySelectorAll('body *').forEach(function(el){
      var tg = el.tagName;
      if(tg === 'A' || tg === 'SCRIPT' || tg === 'STYLE' || tg === 'NOSCRIPT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'INPUT' || tg === 'IMG' || tg === 'BR' || tg === 'IFRAME') return;
      if(el.closest('a')) return;
      if(!pureText(el)) return;
      if(excluded(el)) return;
      out.push(el);
    });
    return out;
  }
  function setEdit(on){
    editing = on;
    document.body.classList.toggle('site-editing', on);
    var bar = $('site-savebar');
    if(bar) bar.classList.toggle('on', on);
    if($('sb-msg')) $('sb-msg').textContent = '';
    var btn = $('site-editbtn');
    if(btn) btn.textContent = on ? '編集を終わる' : '✎ 編集する';
    targets().forEach(function(el){ el.contentEditable = on ? 'true' : 'false'; });
  }
  function undoEdit(){
    targets().forEach(function(el){ var k = el.getAttribute('data-tk'); if(k && applied[k] !== undefined) el.textContent = applied[k]; });
    if($('sb-msg')) $('sb-msg').textContent = '元に戻しました';
  }
  function saveAll(){
    $('sb-msg').textContent = '保存しています…';
    var upd = {};
    targets().forEach(function(el){
      var k = el.getAttribute('data-tk');
      if(!k) return;
      var v = el.textContent.trim();
      if(applied[k] !== undefined && applied[k] !== v) upd[k] = v;
      else if(applied[k] === undefined && v) upd[k] = v;
    });
    var job = Object.keys(upd).length ? db().collection('siteTexts').doc(PAGE).set(upd, {merge: true}).then(function(){ Object.keys(upd).forEach(function(k){ applied[k] = upd[k]; }); }) : Promise.resolve();
    job.then(function(){
      $('sb-msg').textContent = '保存しました';
      setTimeout(function(){ setEdit(false); }, 500);
    }).catch(function(){ $('sb-msg').textContent = '保存できませんでした。時間をおいて試してください。'; });
  }
  function init(){
    if(!window.firebase || !firebase.auth) return;
    ensureApp();
    var els = targets();
    els.forEach(function(el){ el.setAttribute('data-tk', hash(el.textContent.trim())); applied[el.getAttribute('data-tk')] = el.textContent.trim(); });
    if(firebase.firestore){
      db().collection('siteTexts').doc(PAGE).get().then(function(doc){
        if(!doc.exists) return;
        var data = doc.data() || {};
        els.forEach(function(el){ var v = data[el.getAttribute('data-tk')]; if(typeof v === 'string'){ el.textContent = v; applied[el.getAttribute('data-tk')] = v; } });
        els.forEach(function(el){ var k = el.getAttribute('data-tk'); if(applied[k] === undefined) applied[k] = el.textContent.trim(); });
      }).catch(function(){});
    }
    var bar = document.createElement('div');
    bar.id = 'site-savebar';
    bar.innerHTML = '<span id="sb-msg"></span><button type="button" id="sb-save">保存する</button><button type="button" id="sb-cancel">キャンセル</button>';
    document.body.appendChild(bar);
    $('sb-save').addEventListener('click', saveAll);
    $('sb-cancel').addEventListener('click', function(){ if(confirm('保存していない変更を、元に戻しますか？')){ undoEdit(); setEdit(false); } });
    window.__toggleSiteEdit = function(){ setEdit(!editing); };
    window.__isSiteEditing = function(){ return editing; };
    firebase.auth().onAuthStateChanged(function(u){
      var btn = $('site-editbtn');
      if(u && u.uid === OWNER){
        if(!btn){
          btn = document.createElement('button');
          btn.type = 'button';
          btn.id = 'site-editbtn';
          btn.textContent = '✎ 編集する';
          btn.addEventListener('click', function(){ setEdit(!editing); });
          document.body.appendChild(btn);
        }
      } else {
        if(btn) btn.remove();
        if(editing) setEdit(false);
        if(!u && location.hash === '#owner-login'){
          try{ firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(){}); }catch(e){}
        }
      }
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

    if(/探し|探して|リクエスト|代行|欲しい|ほしい/.test(t))return '探し代行';
    if(/送料/.test(t))return '送料';

    if(/まとめ|同梱|セット|複数/.test(t)) return 'まとめ買いできます。気になる商品をこのサイトの買い物かごに集めて、同梱・まとめ買い相談フォームから送れます。メルカリの商品ページからコメントで相談してもらっても大丈夫で、専用ページを作って同梱します。';
    if(/探し|探して|リクエスト|代行|欲しい|ほしい/.test(t)) return '商品探し代行をしています。出品中1,300点以上と店内在庫から探すので、「探しもの：○○（色・サイズ・予算）」と、どれかの商品のメルカリコメント欄にお知らせください。見つかったら出品してお知らせします。';
    if(/送料/.test(t)) return '送料は各商品ページの表示をご確認ください。まとめ買い（同梱）で抑えられる場合があります。';
    if(/コーデ|組み合わせ|着用/.test(t)){ lastTopic='coord'; return 'コーデは3つの見方があります。<br>①「コーデ図鑑」で全56通りを見る<br>②トップページ内の「着用イメージ」を見る<br>③「コーデメーカー」で自分で組み合わせる'+BTN('coords.html','コーデ図鑑（全56通り）を開く')+BTN('index.html#worn','着用イメージを見る','sub'); }

    if(/axes|アクシーズ|昔|廃番|生産終了/.test(t)) return 'アクシーズファムは昔のデザインを探す方が多いブランドです。Leaには15年分の在庫があり、生産終了したデザインも出品しています。出ていない物は商品探し代行で探せます。';
    if(/どこ|場所|住所|店舗|店/.test(t)) return '松山市味酒町3-2-29 MAHALOビル1F（MAHALO美容室内）の雑貨屋です。販売は主にメルカリで行っています。'+BTN(PROFILE,'メルカリのプロフィールを開く');

    return 'すみません、その質問にはここでは答えきれません。探しもの・在庫・まとめ買いはメルカリのコメントでも受け付けています。各カテゴリページの検索でも探せます。'+BTN(PROFILE,'メルカリのプロフィールを開く');
  }
  document.getElementById('botBtn').addEventListener('click',function(){
    panel.classList.toggle('open');
    if(panel.classList.contains('open')&&!log.children.length){
      addMsg('bot','こんにちは。Lea Mahaloです。商品探し、コーデ、まとめ買いの相談ができます。');
    }
  });
  function send(t,isQuick){
    if(!t)return; addMsg('me',t.replace(/</g,'&lt;'));
    if(isQuick){ addMsg('bot',answer(t,'chip')); return; }
    if(window.__geminiAsk){
      var typing=addMsg('bot','考え中…');
      window.__geminiAsk(t).then(function(aiAns){
        if(typing)typing.remove();
        if(aiAns){ addBotText(aiAns); logChat('AIの回答','ai'); }
        else{ var ans=answer(t,'text'); if(window.__logBot)window.__logBot(t,ans.replace(/<[^>]+>/g,'')); addMsg('bot',ans); }
      }).catch(function(){
        if(typing)typing.remove();
        var ans=answer(t,'text'); if(window.__logBot)window.__logBot(t,ans.replace(/<[^>]+>/g,'')); addMsg('bot',ans);
      });
    } else {
      var ans2=answer(t,'text'); if(window.__logBot)window.__logBot(t,ans2.replace(/<[^>]+>/g,'')); addMsg('bot',ans2);
    }
  }
  document.getElementById('botForm').addEventListener('submit',function(e){
    e.preventDefault(); var i=document.getElementById('botInput'); send(i.value.trim(),false); i.value='';
  });
  document.querySelectorAll('#botQuick button').forEach(function(b){b.addEventListener('click',function(){send(b.dataset.q,true);});});
})();
</script>
<script type="module">

var SYS = "あなたは、愛媛県松山市の雑貨屋「Lea Mahalo」のサイト案内役です。名前はありません。名前を聞かれたら「Lea Mahaloです」と答えてください。質問には親しみやすく、短く（1〜3文）答えてください。\n\n\n・嘘をつかないでください。下の知識にないことは作り話をせず、正直に「分からない」と言ってください。\n・個別の商品の在庫・価格・サイズは、ここでは断定しないでください。価格と在庫はメルカリの表示が最新です。気になる商品はサイトのカテゴリページで探せて、商品カードからメルカリの商品ページへ行けます。\n・分からないときや、在庫・探しもの・まとめ買いの相談は、メルカリのコメントへ案内してください。\n・Lea Mahaloと関係のない質問には、「お店のことなら答えられます」とやんわり返してください。\n\n\n・松山市味酒町3-2-29 MAHALOビル1Fの雑貨屋です。実店舗は普段開いておらず、来店は予約制です。販売は主にメルカリで行っていて、全国へ配送します。メルカリのプロフィール：https://jp.mercari.com/user/profile/256767561\n・ご購入の前には、必ず在庫確認のコメントが必要です（必須）。実店舗と在庫を共有しているため、確認なしのご購入はキャンセルをお願いする場合があります。\n・まとめ買い・同梱ができます。サイトの買い物かごに気になる商品を集めて、同梱・まとめ買い相談フォームから送れます。メルカリの商品ページからコメントで相談してもらっても大丈夫で、専用ページを作って同梱します。\n・商品探し代行をしています。出品中の商品と店内在庫から探すので、探しものはメルカリのコメントで知らせてください。\n・axes femmeは、生産終了した昔のデザインを探す人が多いブランドです。Leaには長年の在庫があり、出ていない物は商品探し代行で探せます。\n・コーデの見方は3つあります：コーデ図鑑（全56通り）、着用イメージ、コーデメーカー（自分で組み合わせ）。\n・送料は各商品ページの表示を確認してください。まとめ買い（同梱）で抑えられる場合があります。\n・ハンドメイド作品の委託もしています。";
try {

    try {
      var d = new Date();

      var n = parseInt(localStorage.getItem(key) || '0', 10) + 1;
      localStorage.setItem(key, String(n));
      return n;
    } catch(e){ return 1; }
  }

  window.__logBot = function(q, a){
    try { addDoc(collection(aiDb, 'botLogs'), { q: String(q).slice(0, 300), a: String(a || '').slice(0, 2000), page: location.pathname, site: 'lea', ts: serverTimestamp() }).catch(function(){}); } catch(e){}
  };
  window.__geminiAsk = function(text){
    if (kunUsed() > 20) return Promise.resolve("たくさん聞いてくれて、ありがとうございます。ここから先は、メルカリの商品ページのコメントで聞いてくださいね。在庫確認や探しものも、そちらで受け付けています。");
    function attempt(){
      if (!chat) chat = model.startChat({ history: [] });
      return chat.sendMessage(text).then(function(res){ return res.response.text(); });
    }
    var p = attempt().catch(function(){ chat = null; return attempt(); });
    var timeout = new Promise(function(res){ setTimeout(function(){ res(null); }, 15000); });
    return Promise.race([p, timeout]).then(function(ans){
      if (ans) {
        try { addDoc(collection(aiDb, 'botLogs'), { q: text, a: String(ans).slice(0, 2000), page: location.pathname, site: 'lea', ts: serverTimestamp() }).catch(function(){}); } catch(e){}
        return String(ans);
      }
      return null;
    }).catch(function(){ return null; });
  };
} catch(e){}
