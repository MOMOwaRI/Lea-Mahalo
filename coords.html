<style>
body.site-editing [data-tk]{outline:2px dashed rgba(224,123,36,.55);outline-offset:2px}
#site-editbtn{position:fixed;top:10px;right:max(10px, calc(50% - 350px));z-index:97;background:#fff;color:#b3541e;border:2px solid #e07b24;font-weight:bold;font-family:inherit;font-size:.85rem;border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 12px rgba(120,70,10,.18)}
#site-savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:96;background:#fff;border:1.5px solid #e0a458;border-radius:999px;box-shadow:0 8px 24px rgba(120,70,10,.25);padding:8px 10px;display:none;gap:8px;align-items:center}
#site-savebar.on{display:flex}
#site-savebar button{font-family:inherit;font-weight:bold;border-radius:999px;padding:9px 18px;cursor:pointer}
#sb-save{background:#e07b24;color:#fff;border:none}
#sb-cancel{background:#fff;color:#8a6a4f;border:1.5px solid #d8c7ae}
#sb-msg{font-size:.82rem;color:#8a6a4f}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var PAGE = 'lea-coords';
  var OWNER = 'ELCzyeeoDCU4gveavc077L4jBqE3';
  var EXCLUDED = '#site-savebar,#site-editbtn,.ied-panel,script,style,textarea,select,#cartbar,#cartPanel,#cartToast,.cart-box,#hitcount,.cchips,.chip,.gchip';
  var editing = false;
  var applied = {};
  function $(id){ return document.getElementById(id); }
  function hash(t){ var h = 0; for(var i = 0; i < t.length; i++){ h = (h * 31 + t.charCodeAt(i)) | 0; } return 'k' + (h >>> 0).toString(36); }
  function ensureApp(){ try{ if(window.firebase && !firebase.apps.length){ firebase.initializeApp({
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
}); } }catch(e){} }
  function db(){ return firebase.firestore(); }
  function pureText(el){ for(var i = 0; i < el.childNodes.length; i++){ if(el.childNodes[i].nodeType === 1) return false; } return (el.textContent || '').trim().length > 0; }
  function excluded(el){ try{ return !!el.closest(EXCLUDED); }catch(e){ return false; } }
  function targets(){
    var out = [];
    document.querySelectorAll('body *').forEach(function(el){
      var tg = el.tagName;
      if(tg === 'A' || tg === 'SCRIPT' || tg === 'STYLE' || tg === 'NOSCRIPT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'INPUT' || tg === 'IMG' || tg === 'BR' || tg === 'IFRAME') return;
      if(el.closest('a')) return;
      if(!pureText(el)) return;
      if(excluded(el)) return;
      out.push(el);
    });
    return out;
  }
  function setEdit(on){
    editing = on;
    document.body.classList.toggle('site-editing', on);
    var bar = $('site-savebar');
    if(bar) bar.classList.toggle('on', on);
    if($('sb-msg')) $('sb-msg').textContent = '';
    var btn = $('site-editbtn');
    if(btn) btn.textContent = on ? '編集を終わる' : '✎ 編集する';
    targets().forEach(function(el){ el.contentEditable = on ? 'true' : 'false'; });
  }
  function undoEdit(){
    targets().forEach(function(el){ var k = el.getAttribute('data-tk'); if(k && applied[k] !== undefined) el.textContent = applied[k]; });
    if($('sb-msg')) $('sb-msg').textContent = '元に戻しました';
  }
  function saveAll(){
    $('sb-msg').textContent = '保存しています…';
    var upd = {};
    targets().forEach(function(el){
      var k = el.getAttribute('data-tk');
      if(!k) return;
      var v = el.textContent.trim();
      if(applied[k] !== undefined && applied[k] !== v) upd[k] = v;
      else if(applied[k] === undefined && v) upd[k] = v;
    });
    var job = Object.keys(upd).length ? db().collection('siteTexts').doc(PAGE).set(upd, {merge: true}).then(function(){ Object.keys(upd).forEach(function(k){ applied[k] = upd[k]; }); }) : Promise.resolve();
    job.then(function(){
      $('sb-msg').textContent = '保存しました';
      setTimeout(function(){ setEdit(false); }, 500);
    }).catch(function(){ $('sb-msg').textContent = '保存できませんでした。時間をおいて試してください。'; });
  }
  function init(){
    if(!window.firebase || !firebase.auth) return;
    ensureApp();
    var els = targets();
    els.forEach(function(el){ el.setAttribute('data-tk', hash(el.textContent.trim())); applied[el.getAttribute('data-tk')] = el.textContent.trim(); });
    if(firebase.firestore){
      db().collection('siteTexts').doc(PAGE).get().then(function(doc){
        if(!doc.exists) return;
        var data = doc.data() || {};
        els.forEach(function(el){ var v = data[el.getAttribute('data-tk')]; if(typeof v === 'string'){ el.textContent = v; applied[el.getAttribute('data-tk')] = v; } });
        els.forEach(function(el){ var k = el.getAttribute('data-tk'); if(applied[k] === undefined) applied[k] = el.textContent.trim(); });
      }).catch(function(){});
    }
    var bar = document.createElement('div');
    bar.id = 'site-savebar';
    bar.innerHTML = '<span id="sb-msg"></span><button type="button" id="sb-save">保存する</button><button type="button" id="sb-cancel">キャンセル</button>';
    document.body.appendChild(bar);
    $('sb-save').addEventListener('click', saveAll);
    $('sb-cancel').addEventListener('click', function(){ if(confirm('保存していない変更を、元に戻しますか？')){ undoEdit(); setEdit(false); } });
    window.__toggleSiteEdit = function(){ setEdit(!editing); };
    window.__isSiteEditing = function(){ return editing; };
    firebase.auth().onAuthStateChanged(function(u){
      var btn = $('site-editbtn');
      if(u && u.uid === OWNER){
        if(!btn){
          btn = document.createElement('button');
          btn.type = 'button';
          btn.id = 'site-editbtn';
          btn.textContent = '✎ 編集する';
          btn.addEventListener('click', function(){ setEdit(!editing); });
          document.body.appendChild(btn);
        }
      } else {
        if(btn) btn.remove();
        if(editing) setEdit(false);
        if(!u && location.hash === '#owner-login'){
          try{ firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(){}); }catch(e){}
        }
      }
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
